<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--Bulma-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <!--Font Awesome-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <!--Bandeiras-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css" />
  <!--CSS-->
  <link rel="stylesheet" href="../CSS/style.css" />
  <link rel="stylesheet" href="./css/sis_estoque.css" />
  <link rel="icon" type="image/png" href="../imagens/logos/icone_disco2.png" sizes="64x64" />
  <title>BilliVinil - Controle de Estoque</title>
</head>

<body>

  <nav class="navbar">
    <div class="container">
      <div class="navbar-brand">
        <span class="navbar-item has-text-weight-bold">
          <i class="fa-solid fa-cat fa-xl has-text-link"></i>
          <h1 class="subtitle is-3 mt-1 ml-3 is-5 has-text-warning">Cadastro e Estoque</h1>
        </span>
      </div>
      <div class="navbar-menu">
        <div class="navbar-end">
          <div class="navbar-item">
            <button id="btn-logout" class="button is-danger is-outlined">
              <span class="icon"><i class="fas fa-sign-out-alt"></i></span>
              <span>Sair</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <section class="section-fundo-estoque section">
    <div class="container">

      <div class="mb-5">
        <button id="btn-abrir-formulario" class="button is-link">
          <span class="icon"><i class="fas fa-plus"></i></span>
          <span>Cadastrar novo disco</span>
        </button>
      </div>

      <div id="container-formulario" class="is-hidden">
        <form id="form-cadastro-completo" class="box">

          <!--Álbum-->
          <div class="columns is-multiline">
            <div class="column is-4">
              <label class="label">Álbum</label>
              <input class="input" type="text" id="id-album" required>
            </div>

            <!--Artista-->
            <div class="column is-4">
              <label class="label">Artista</label>
              <input class="input" type="text" id="id-artista" required>
            </div>

            <!--Lan-->
            <div class="column is-2">
              <label class="label">Ano Lançamento</label>
              <input class="input" type="number" id="id-lancamento">
            </div>

            <!--Edição-->
            <div class="column is-2">
              <label class="label">Ano Edição</label>
              <input class="input" type="number" id="id-edicao">
            </div>
          </div>

          <!--Formato-->
          <div class="columns is-multiline">
            <div class="column is-2">
              <label class="label">Tamanho / Formato</label>
              <div class="select is-fullwidth">
                <select id="id-tipo">
                  <option value="" disabled selected>Selecione</option>
                  <option value='LP 12"'>LP 12"</option>
                  <option value='Single 7"'>Single 7"</option>
                  <option value='Compacto 7"'>Compacto 7"</option>
                  <option value='EP 10"'>EP 10"</option>
                  <option value='Maxi Single 12"'>Maxi Single 12"</option>
                </select>
              </div>
            </div>

            <!--Qdt-->
            <div class="column is-2">
              <label class="label">Qtd Discos</label>
              <div class="select is-fullwidth">
                <select id="id-qtd-discos">
                  <option value="" disabled selected>Selecione</option>
                  <option value="Simples">Simples</option>
                  <option value="Duplo">Duplo</option>
                  <option value="Triplo">Triplo</option>
                  <option value="Quádruplo">Quádruplo</option>
                </select>
              </div>
            </div>

            <!--Peso-->
            <div class="column is-2">
              <label class="label">Peso</label>
              <div class="select is-fullwidth">
                <select id="id-peso">
                  <option value="" disabled selected>Selecione</option>
                  <option value="120g">120g</option>
                  <option value="140g">140g</option>
                  <option value="180g">180g</option>
                  <option value="200g">200g</option>
                </select>
              </div>
            </div>

            <!--Origem-->
            <div class="column is-3">
              <label class="label">País Origem</label>
              <div class="select is-fullwidth">
                <select id="id-pais-origem" name="pais">
                  <option value="" disabled selected>Selecione</option>
                  <option value="br">Brasil</option>
                  <option value="us">EUA</option>
                  <option value="gb">Reino Unido</option>
                  <option value="gb-eng">Inglaterra</option>
                  <option value="eu">Europa</option>
                  <option value="jp">Japão</option>
                  <option value="fr">França</option>
                  <option value="de">Alemanha</option>
                  <option value="it">Itália</option>
                  <option value="at">Áustria</option>
                  <option value="se">Suécia</option>
                  <option value="ru">Rússia</option>
                  <option value="nl">Holanda</option>
                  <option value="ca">Canadá</option>
                  <option value="au">Austrália</option>
                  <option value="ar">Argentina</option>
                  <option value="cl">Chile</option>
                  <option value="uy">Uruguai</option>
                  <option value="ot">Outro</option>
                </select>
              </div>
            </div>

            <!--Fab-->
            <div class="column is-3">
              <label class="label">País Fabr.</label>
              <div class="select is-fullwidth">
                <select id="id-pais-fabricacao" name="paisFab">
                  <option value="" disabled selected>Selecione</option>
                  <option value="br">Brasil</option>
                  <option value="us">EUA</option>
                  <option value="gb">Reino Unido</option>
                  <option value="gb-eng">Inglaterra</option>
                  <option value="eu">Europa</option>
                  <option value="jp">Japão</option>
                  <option value="fr">França</option>
                  <option value="de">Alemanha</option>
                  <option value="it">Itália</option>
                  <option value="at">Áustria</option>
                  <option value="se">Suécia</option>
                  <option value="ru">Rússia</option>
                  <option value="nl">Holanda</option>
                  <option value="ca">Canadá</option>
                  <option value="au">Austrália</option>
                  <option value="ar">Argentina</option>
                  <option value="cl">Chile</option>
                  <option value="uy">Uruguai</option>
                  <option value="ot">Outro</option>
                </select>
              </div>
            </div>
          </div>

          <div class="columns is-vcentered">

            <!--Preço-->
            <div class="column is-3">
              <label class="label">Preço (R$)</label>
              <input class="input" type="number" step="0.01" id="id-preco" required>
            </div>

            <!--Quantidade-->
            <div class="column is-2">
              <label class="label">Quantidade</label>
              <input class="input" type="number" id="id-estoque" required>
            </div>

            <!--Desconto-->
            <div class="column is-3">
              <label class="label">Em Oferta?</label>
              <div class="field is-grouped is-grouped-multiline" style="align-items: center;">
                <input id="id-switch-desconto" type="checkbox" class="switch is-rounded is-info">
                <label for="id-switch-desconto" class="has-text-grey ml-2">Não</label>
              </div>
            </div>

            <!--%-->
            <div class="column is-4">
              <div id="container-select-desconto" class="is-hidden">
                <label class="label">Porcentagem</label>
                <div class="control has-icons-left">
                  <div class="select is-fullwidth is-info">
                    <select id="id-desconto-valor"></select>
                  </div>
                  <span class="icon is-left"><i class="fas fa-percent"></i></span>
                </div>
              </div>
            </div>
          </div>

          <!--Capa-->
          <div class="columns mt-4">
            <div class="column is-4">
              <label class="label">Capa</label>
              <div class="file has-name is-fullwidth">
                <label class="file-label">
                  <input class="file-input" type="file" id="id-arquivo-capa" accept="image/*">
                  <span class="file-cta">
                    <span class="file-icon"><i class="fas fa-upload"></i></span>
                    <span class="file-label">Capa...</span>
                  </span>
                  <span class="file-name" id="id-nome-arq-capa">Nenhum arquivo...</span>
                </label>
              </div>
            </div>

            <!--Galeria-->
            <div class="column is-4">
              <label class="label">Galeria (Máx 10)</label>
              <div class="file has-name is-fullwidth">
                <label class="file-label">
                  <input class="file-input" type="file" id="id-arquivo-galeria" multiple>
                  <span class="file-cta">
                    <span class="file-icon"><i class="fas fa-images"></i></span>
                    <span class="file-label">Fotos...</span>
                  </span>
                  <span class="file-name" id="id-nome-arq-galeria">0 fotos</span>
                </label>
              </div>
            </div>

            <!--Gênero-->
            <div class="column is-4">
              <label class="label">Gênero / Estilo</label>
              <div class="field has-addons">
                <div class="control is-expanded">
                  <input class="input" type="text" id="id-input-estilo" placeholder="Ex: Rock">
                </div>
                <div class="control">
                  <button type="button" class="button is-info" id="btn-add-estilo">
                    <i class="fas fa-plus"></i>
                  </button>
                </div>
              </div>
              <div id="container-estilos-adicionados" class="tags mt-2"></div>
            </div>
          </div>

          <!--Faixas-->
          <div class="columns">
            <div class="field mt-4">
              <label class="label">Lista de Faixas (Músicas)</label>
              <div id="container-lados-dinamicos">
              </div>

              <div class="control mt-3">
                <button type="button" class="ml-2 button is-info" id="btn-add-lado">
                  <span class="icon"><i class="fas fa-plus-circle"></i></span>
                  <span>Adicionar Lado (A, B, C...)</span>
                </button>
              </div>
            </div>
          </div>

          <div class="columns">

            <!--Tags-->
            <div class="column is-12">
              <label class="label">Selecione as Tags: </label>
              <div id="tag-toggle-container" class="disco-tags">
                <span class="tag is-clickable toggle-tag verde-tag" data-value="Bom Estado" data-class="verde-tag">Bom
                  Estado</span>
                <span class="tag is-clickable toggle-tag azul-claro-tag" data-value="Clássico"
                  data-class="azul-claro-tag">Clássico</span>
                <span class="tag is-clickable toggle-tag importado-tag" data-value="Cult"
                  data-class="importado-tag">Cult</span>
                <span class="tag is-clickable toggle-tag destaque-tag" data-value="Destaque"
                  data-class="destaque-tag">Destaque</span>
                <span class="tag is-clickable toggle-tag azul-claro-tag" data-value="Edição Limitada"
                  data-class="azul-claro-tag">Edição Limitada</span>
                <span class="tag is-clickable toggle-tag turquesa-tag" data-value="Excelente Estado"
                  data-class="turquesa-tag">Excelente Estado</span>
                <span class="tag is-clickable toggle-tag importado-tag" data-value="Importado"
                  data-class="importado-tag">Importado</span>
                <span class="tag is-clickable toggle-tag prata-tag" data-value="Lacrado"
                  data-class="prata-tag">Lacrado</span>
                <span class="tag is-clickable toggle-tag verde-tag" data-value="Novo" data-class="verde-tag">Novo</span>
                <span class="tag is-clickable toggle-tag oferta-tag" data-value="Oferta"
                  data-class="oferta-tag">Oferta</span>
                <span class="tag is-clickable toggle-tag gold-tag" data-value="Raro" data-class="gold-tag">Raro</span>
                <span class="tag is-clickable toggle-tag vermelho-tag" data-value="Remaster"
                  data-class="vermelho-tag">Remaster</span>
              </div>
            </div>
          </div>

          <!--Resumo-->
          <div class="columns">
            <div class="column is-12">
              <label class="label">Resumo / Descrição do Álbum</label>
              <div class="control">
                <textarea class="textarea" id="id-resumo" placeholder="Escreva um breve resumo sobre o álbum (máx 700 caracteres)"
                  rows="3" maxlength="700"></textarea>
              </div>
            </div>
          </div>

          <div class="has-text-centered mt-5">
            <div class="buttons is-centered">
              <button type="submit" class="button is-link">Salvar Disco</button>
              <button type="button" class="button is-danger" id="btn-cancelar">Cancelar</button>
            </div>
          </div>

        </form>
      </div>

      <hr>

      <!--Filtros e Busca-->
    <div class="box">
        <div class="columns is-multiline">

                <h2 class="subtitle m-4 has-text-warning"><span class="mx-2 has-text-link"><i class="fa-solid fa-magnifying-glass"></i></span>Buscar Disco</h2>

          <div class="column is-12">
            <label class="label">Busca</label>
            <p class="control has-icons-left">
              <input id="filtro-busca" class="input is-small" type="text" placeholder="Buscar por álbum ou artista">
              <span class="icon is-small is-left">
                <i class="fas fa-search"></i>
              </span>
            </p>
          </div>

          <div class="column is-3">
            <label class="label is-small">Artista</label>
            <div class="select is-fullwidth is-small">
              <select id="filtro-artista">
                <option value="">Todos</option>
              </select>
            </div>
          </div>

          <div class="column is-2">
            <label class="label is-small">Lançamento (De - Até)</label>
            <div class="field is-grouped">
              <p class="control is-expanded">
                <input id="lanc-de" class="input is-small" type="number" placeholder="De">
              </p>
              <p class="control is-expanded">
                <input id="lanc-ate" class="input is-small" type="number" placeholder="Até">
              </p>
            </div>
          </div>

          <div class="column is-2">
            <label class="label is-small">Edição (De - Até)</label>
            <div class="field is-grouped">
              <p class="control is-expanded">
                <input id="edic-de" class="input is-small" type="number" placeholder="De">
              </p>
              <p class="control is-expanded">
                <input id="edic-ate" class="input is-small" type="number" placeholder="Até">
              </p>
            </div>
          </div>

          <div class="column is-3">
            <label class="label is-small">Estilo Musical</label>
            <div class="select is-fullwidth is-small">
              <select id="filtro-estilo">
                <option value="">Todos</option>
              </select>
            </div>
          </div>

          <div class="column is-2">
            <label class="label is-small">Tag / Selo</label>
            <div class="select is-fullwidth is-small">
              <select id="filtro-tag">
                <option value="">Todos</option>
              </select>
            </div>
          </div>

          <div class="column is-2">
            <label class="label is-small">Oferta</label>
            <div class="select is-fullwidth is-small">
              <select id="filtro-oferta">
                <option value="">Todos</option>
                <option value="sim">Com desconto</option>
                <option value="nao">Sem desconto</option>
              </select>
            </div>
          </div>

          <div class="column is-2">
            <label class="label is-small">% Desconto</label>
            <div class="select is-fullwidth is-small">
              <select id="filtro-desconto" disabled>
                <option value=""></option>
              </select>
            </div>
          </div>

          <div class="column is-2">
            <label class="label is-small">País Fabricação</label>
            <div class="select is-fullwidth is-small">
              <select id="filtro-pais-fab">
                <option value="">Todos</option>
              </select>
            </div>
          </div>

          <div class="column is-2">
            <label class="label is-small">País Origem</label>
            <div class="select is-fullwidth is-small">
              <select id="filtro-pais-origem">
                <option value="">Todos</option>
              </select>
            </div>
          </div>

          <div class="column is-12">

            <div class="is-flex is-justify-content-center is-align-items-center mt-3">

              <div class="mr-3">
                <button class="button is-link is-small" onclick="aplicarFiltros()">
                  <span class="icon is-small">
                    <i class="fas fa-search"></i>
                  </span>
                  <span>Buscar</span>
                </button>
              </div>

              <div>
                <button class="button is-danger is-small" onclick="limparTodosFiltros()">
                  <span class="icon is-small">
                    <i class="fa-solid fa-trash-can"></i>
                  </span>
                  <span>Limpar Filtros</span>
                </button>
              </div>

            </div>
          </div>

        </div>
      </div>

      <hr>

      <!--Tabela-->
      <div class="box mt-6">
        <h2 class="subtitle is-5 has-text-warning"><span class="m-2 has-text-link"><i class="fa-solid fa-record-vinyl"></i></span>Inventário de Discos</h2>
        <div class="table-container">
          <table class="table is-fullwidth is-striped">

            <thead>
              <tr>
                <th>ID</th>
                <th>Álbum</th>
                <th>Artista</th>
                <th>Preço</th>
                <th>Desc</th>
                <th>Estoque</th>
                <th>Detalhes</th>
              </tr>
            </thead>

            <tbody id="id-lista-estoque"></tbody>

          </table>

          <div id="dashboard-estoque" class="mt-5"></div>

        </div>


      </div>

    </div>

  </section>

  <div id="id-container-modais"></div>

  <script src="./js/sis_estoque.js"></script>
</body>

</html>
