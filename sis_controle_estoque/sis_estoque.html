<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="../CSS/style.css" />
  <link rel="stylesheet" href="sis_estoque.css" />
  <link rel="icon" type="image/png" href="../imagens/logos/icone_disco2.png" sizes="64x64" />
  <title>BilliVinil - Controle de Estoque</title>
</head>
<body>

<section class="section-fundo-estoque section">
  <div class="container">
    <h1 class="title is-4 mb-5 has-text-link">Sistema de Cadastro e Estoque</h1>

    <form id="form-cadastro-completo" class="box">
      <div class="columns">
        <div class="column is-4">
          <label class="label">Álbum</label>
          <input class="input" type="text" id="id-album" required>
        </div>

        <div class="column is-4">
          <label class="label">Artista</label>
          <input class="input" type="text" id="id-artista" required>
        </div>

        <div class="column is-2">
          <label class="label">Ano Lançamento</label>
          <input class="input" type="number" id="id-lancamento">
        </div>

        <div class="column is-1">
          <label class="label">Estoque</label>
          <input class="input" type="number" id="id-estoque" required>
        </div>

        <div class="column is-1">
          <label class="label">Desc%</label>
          <input class="input" type="number" id="id-desconto" value="0">
        </div>
      </div>

      <div class="columns">
        <div class="column is-3">
          <label class="label">Peso e Qtd (ex: 180g Duplo)</label>
          <input class="input" type="text" id="id-descricao">
        </div>

        <div class="column is-3">
          <label class="label">Tipo (ex: LP 12")</label>
          <input class="input" type="text" id="id-tipo">
        </div>

        <div class="column is-2">
          <label class="label">País Origem</label>
          <input class="input" type="text" id="id-pais-origem">
        </div>

        <div class="column is-2">
          <label class="label">País Fabr.</label>
          <input class="input" type="text" id="id-pais-fabricacao">
        </div>

        <div class="column is-2">
          <label class="label">Preço (R$)</label>
          <input class="input" type="number" step="0.01" id="id-preco" required>
        </div>
      </div>

      <div class="columns">
        <div class="column is-6">
          <label class="label">Capa do Álbum</label>
          <div class="file has-name is-fullwidth">
            <label class="file-label">
              <input class="file-input" type="file" id="id-arquivo-capa" accept="image/*">
              <span class="file-cta">
                <span class="file-icon"><i class="fas fa-upload"></i></span>
                <span class="file-label">Escolher capa...</span>
              </span>
              <span class="file-name has-text-grey" id="id-nome-arq-capa">Nenhum arquivo...</span>
            </label>
          </div>
        </div>

        <div class="column is-4">
          <label class="label">Galeria de Fotos (Máx. 10)</label>
          <div class="file has-name is-fullwidth">
            <label class="file-label">
              <input class="file-input" type="file" id="id-arquivo-galeria" accept="image/*" multiple>
              <span class="file-cta">
                <span class="file-icon"><i class="fas fa-images"></i></span>
                <span class="file-label">Escolher fotos...</span>
              </span>
              <span class="file-name has-text-grey" id="id-nome-arq-galeria">0 fotos</span>
            </label>
          </div>
        </div>

        <div class="column is-2">
          <label class="label">Ano Edição</label>
          <input class="input" type="number" id="id-edicao">
        </div>
      </div>

      <div class="columns">
        <div class="column is-6">
          <label class="label">Músicas</label>
          <textarea class="textarea" id="id-musicas" placeholder='Faixas por lado' rows="8"></textarea>
        </div>

        <div class="column is-6">
          <label class="label">Resumo</label>
          <textarea class="textarea" id="id-resumo" placeholder="Breve descrição do álbum..." rows="8"></textarea>
        </div>
      </div>

      <button type="submit" class="button is-link is-medium mt-4">Salvar Disco</button>
    </form>

    <div class="box mt-6">
      <h2 class="subtitle is-5">Inventário de Itens Completos</h2>
      <div class="table-container">
        <table class="table is-fullwidth is-striped">

          <thead>
            <tr>
              <th>ID</th>
              <th>Álbum</th>
              <th>Artista</th>
              <th>Preço</th>
              <th>Desc%</th>
              <th>Estoque</th>
              <th>Editar</th>
            </tr>
          </thead>

          <tbody id="id-lista-estoque">
          </tbody>

        </table>

      </div>
    </div>
  </div>

</section>



<script src="sis_estoque.js"></script>
</body>
</html>
